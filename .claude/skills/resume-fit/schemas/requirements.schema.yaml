# requirements.yaml — the JD parsed once into a canonical schema at intake.
# Every downstream step consumes this, never the raw JD (plan section 2).
type: object
required: [company, role, hard_requirements, preferred_requirements, ats_keywords]
properties:
  company: {type: str}
  role: {type: str}
  source: {type: str}            # file | text | url
  source_url: {type: str}        # the posting URL when known
  # Location facts, exactly as the JD states them (no candidate-side judgment
  # here; that lives in location.yaml). location_gate.py rejects unknown values.
  location: {type: str}          # e.g. "New York, NY"; null if the JD states none
  work_arrangement: {type: str}  # remote | hybrid | onsite | unstated
  hybrid_days: {type: number}    # office days per week, if stated
  relocation_support: {type: str}  # offered | not-offered | unstated
  seniority: {type: str}         # ic | lead | manager | director | exec
  hard_requirements:
    type: list
    items:
      required: [id, text]
      properties:
        id: {type: str}          # e.g. hr-1
        text: {type: str}
        keywords: {type: list}
  preferred_requirements:
    type: list
    items:
      required: [id, text]
      properties:
        id: {type: str}          # e.g. pr-1
        text: {type: str}
        keywords: {type: list}
  ats_keywords: {type: list}     # exact-match terms an ATS/recruiter scans for
  recruiter_persona_cues: {type: list}
