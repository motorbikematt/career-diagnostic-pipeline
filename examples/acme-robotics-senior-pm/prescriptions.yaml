prescriptions:
  - type: reorder
    target: "Top fold — lead with hardware/platform, not analytics"
    why: >
      Resume reads SaaS-analytics-first; a robotics recruiter's fast scan
      misses the hardware signal. Move Circuit Dynamics hardware-to-production
      above the analytics narrative.
    closes: [first_friction_trigger]
    source: circuit-dynamics
  - type: banner
    target: "Banner line under the name"
    jd_title: "Senior Product Manager, Robotics Platform"
    why: >
      Ties the resume to the posting at a glance. The JD title verbatim, under the
      banner exception (banner only); the title of record stays in the role entry.
  - type: summary
    target: "Summary section"
    why: >
      Rebuild to who / what / how / proof. Currently signals a SaaS analytics PM;
      the proof sentence must tie platform + connected-hardware breadth to a
      robotics platform.
    closes: [hr-2]
    source: circuit-dynamics
  - type: add
    target: "Surface the 50k-units prototype-to-production metric in the top third"
    role: "Circuit Dynamics — Product Manager (2018–2021)"
    why: >
      The prototype-to-production line is the first escalation trigger but carries
      no measure; the WHD's 50k-units figure gives it one the deep read can weigh.
    closes: [first_escalation_trigger]
    source: circuit-dynamics.p1
  - type: reframe
    target: "On-device computer vision bullet"
    role: "Circuit Dynamics — Product Manager (2018–2021)"
    why: >
      Signals a consumer-camera feature; reframe as edge-inference/perception
      work adjacent to robotics perception.
    closes: [hr-2, pr-2]
    source: circuit-dynamics.p2
  - type: compress
    target: "Early role — 'Analyst, DataCorp' (2011–2013), five bullets"
    why: >
      Pre-PM analyst work, no JD linkage; condense five bullets to a single line
      to reclaim space for the robotics-relevant recent roles.
    relevance: none
    frees_lines: 4
  - type: cut
    target: "'Interests' section (cycling, homebrewing, board games)"
    why: >
      Zero JD linkage and pure filler on a senior IC resume; remove entirely.
    relevance: none
    frees_lines: 2
